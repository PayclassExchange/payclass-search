<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payclass Search</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; line-height: 1.4; }
  header { background: #fff; border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
  header img { display: block; height: 72px; width: auto; }
  h1 { font-size: 1.25rem; margin: 0.75rem 0 0; }
  .muted { color: #666; font-size: 0.9rem; }
  .signin-box { margin-top: 0.75rem; padding: 0.75rem 1rem; border: 2px solid #2563eb; border-radius: 8px; color: inherit; font-size: 1rem; }
  .signin { display: inline-block; padding: 0.5rem 1rem; border-radius: 4px; background: #2563eb; color: #fff; font-weight: 600; text-decoration: none; margin-right: 0.4rem; }
  fieldset { border: 1px solid #8884; border-radius: 6px; padding: 1rem; margin: 1rem 0; }
  legend { padding: 0 0.4rem; font-weight: 600; }
  label { display: block; margin: 0.5rem 0 0.2rem; font-size: 0.9rem; }
  input, select, textarea { width: 100%; box-sizing: border-box; padding: 0.5rem; font: inherit; border: 1px solid #8886; border-radius: 4px; background: transparent; color: inherit; }
  .sources { display: grid; grid-template-columns: 1fr; gap: 0.3rem; margin-top: 0.5rem; }
  .source { margin: 0; border: 1px solid #8886; border-radius: 6px; padding: 0.3rem 0.6rem; display: flex; gap: 0.5rem; align-items: center; cursor: pointer; }
  .source input { width: auto; margin: 0; }
  .source span { display: flex; gap: 0.5rem; align-items: baseline; flex-wrap: wrap; }
  .source small { display: inline; color: #666; }
  .hidden { display: none; }
  button { margin-top: 0.75rem; padding: 0.6rem 1.2rem; font: inherit; border: 0; border-radius: 4px; background: #2563eb; color: #fff; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: wait; }
  .status { margin-top: 1rem; font-weight: 600; }
  .error { color: #b91c1c; }
  h2 { font-size: 1rem; margin: 1.25rem 0 0.25rem; }
  pre { background: #8881; padding: 0.75rem; border-radius: 6px; overflow: auto; font-size: 0.85rem; max-height: 420px; }
  .step { margin-top: 0.5rem; }
  #results { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0.9rem; margin-top: 1rem; align-items: start; }
  .tile { border: 1px solid #8884; border-radius: 8px; overflow: hidden; }
  .tile header { display: flex; justify-content: space-between; gap: 0.5rem; padding: 0.6rem 0.8rem; background: #8881; }
  .tile-body { padding: 0.6rem 0.8rem; max-height: 380px; overflow-y: auto; }
  ol.links { padding-left: 1.25rem; }
  ol.links li { margin-bottom: 0.9rem; }
  ol.links a { font-weight: 600; }
</style>
</head>
<body>
<header>
  <img src="/static/payclass-logo.jpg" alt="Payclass, Your Capital Partner">
  <h1>Payclass Search</h1>
  <div id="auth" class="muted" style="margin-top:0.5rem"></div>
</header>

<fieldset>
  <legend>Request</legend>
  <label for="mode">Mode</label>
  <select id="mode">
    <option value="structured">Pick sources</option>
    <option value="plain">Plain language (the server chooses sources)</option>
  </select>

  <div id="structBox">
    <label>Sources</label>
    <div class="sources">
      <label class="source"><input type="checkbox" name="src" value="web_search" checked><span>Web search</span></label>
      <label class="source"><input type="checkbox" name="src" value="news_search"><span>News</span></label>
      <label class="source"><input type="checkbox" name="src" value="drive_search"><span>Internal folders and files</span></label>
      <label class="source"><input type="checkbox" name="src" value="court_search"><span>Courts</span></label>
      <label class="source"><input type="checkbox" name="src" value="filing_search"><span>SEC filings</span></label>
      <label class="source"><input type="checkbox" name="src" value="economic_search"><span>Economic data</span></label>
    </div>
    <label for="query">Search</label>
    <input id="query" type="text">
    <div class="muted" style="margin-top:0.5rem">Filing types (SEC only, optional, comma-separated): <input id="forms" type="text" placeholder="10-K, 8-K" style="width:auto;display:inline-block;margin-left:0.5rem"></div>
  </div>

  <div id="plainBox" class="hidden">
    <label for="request">What do you want to search for?</label>
    <textarea id="request" rows="3"></textarea>
  </div>

  <button id="go">Search</button>
</fieldset>

<div id="status" class="status"></div>
<div id="results"></div>

<script>
const $ = (id) => document.getElementById(id);
const LABELS = { web_search: "Web search", news_search: "News", court_search: "Courts", filing_search: "SEC filings", economic_search: "Economic data", drive_search: "Internal folders and files" };

$("mode").addEventListener("change", () => {
  const plain = $("mode").value === "plain";
  $("plainBox").classList.toggle("hidden", !plain);
  $("structBox").classList.toggle("hidden", plain);
});

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function taskFor(type, query, forms) {
  const limit = 10;
  if (type === "court_search") return { type, party_name: query, limit };
  if (type === "news_search") return { type, query, days: 30, limit };
  if (type === "filing_search") return { type, query, forms, limit };
  return { type, query, limit };
}

async function postGdelt(query) {
  const resp = await fetch("/ui/gdelt", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ query, limit: 50 }),
  });
  if (!resp.ok) throw new Error("GDELT unavailable");
  return resp.json();
}

function mergeGdelt(main, gdelt) {
  if (main.status === "clarification_needed" || !gdelt || gdelt.status !== "ok" || !gdelt.items.length) return main;
  const results = { ...(main.results || {}) };
  const key = Object.keys(results).find((k) => results[k].status === "ok" && Array.isArray(results[k].items));
  const seen = new Set();
  const existing = key ? results[key].items : [];
  existing.forEach((it) => seen.add(it.url));
  const extra = gdelt.items.filter((it) => it.url && !seen.has(it.url));
  if (key) {
    results[key] = { ...results[key], items: [...existing, ...extra] };
  } else {
    results.gdelt = { status: "ok", items: extra };
  }
  return { ...main, results };
}

async function fetchSource(type, query, forms) {
  if (type === "drive_search") return postDrive(query);
  if (type !== "news_search") return post({ task: taskFor(type, query, forms) });
  const [main, gdelt] = await Promise.all([
    post({ task: taskFor(type, query, forms) }),
    postGdelt(query).catch(() => null),
  ]);
  return mergeGdelt(main, gdelt);
}

async function postDrive(query) {
  const resp = await fetch("/ui/drive", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ query, limit: 10 }),
  });
  const data = await resp.json().catch(() => ({}));
  if (resp.status === 401) throw new Error("Connect with your Payclass credential to search internal folders and files.");
  if (!resp.ok) throw new Error(data.detail || resp.statusText);
  return data;
}

async function loadAuth() {
  const box = $("auth");
  const resp = await fetch("/auth/me");
  if (resp.ok) {
    const me = await resp.json();
    box.className = "muted";
    box.innerHTML = "Signed in as " + esc(me.email) + ' &middot; <a href="#" id="logout">Sign out</a>';
    $("logout").addEventListener("click", async (e) => {
      e.preventDefault();
      await fetch("/auth/logout", { method: "POST" });
      location.reload();
    });
  } else {
    box.className = "signin-box";
    box.innerHTML = '<a class="signin" href="/auth/google/login">Connect with your Payclass credential</a>to search internal folders and files (Payclass accounts only).';
  }
}
loadAuth();

async function post(body) {
  const resp = await fetch("/ui/tasks", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.detail || resp.statusText);
  return data;
}

function tileHtml(title, status, bodyHtml) {
  return '<section class="tile"><header><strong>' + esc(title) + '</strong><span class="muted">' + esc(status || "") + '</span></header><div class="tile-body">' + bodyHtml + "</div></section>";
}

function tileFor(title, data, pending = false) {
  if (data.status === "clarification_needed") {
    return tileHtml(title, "needs clarification", '<div>' + esc(data.question) + "</div>");
  }
  let body = "";
  let total = 0;
  for (const step of Object.values(data.results || {})) {
    if (step.status !== "ok" || !Array.isArray(step.items)) {
      body += '<div class="error">' + esc(step.status || "error") + "</div>";
      continue;
    }
    total += step.items.length;
    if (step.items.length === 0) {
      body += '<div class="muted">Results (0)</div>';
      continue;
    }
    body += '<ol class="links">' + step.items.map((it) =>
      '<li><a href="' + esc(it.url || "#") + '" target="_blank" rel="noopener noreferrer">' + esc(it.title || it.url || "(untitled)") + "</a></li>").join("") + "</ol>";
  }
  const count = "Results (" + total + ")";
  const status = data.status && data.status !== "ok" ? data.status + " · " + count : count;
  return tileHtml(title, status, (body || '<div class="muted">Results (0)</div>') + (pending ? pendingNote() : ""));
}

function pendingNote() {
  return '<div class="muted pending-note">AI is still reviewing relevance. This order may change in a moment.</div>';
}

async function rankStep(query, step) {
  if (step.status !== "ok" || !Array.isArray(step.items) || step.items.length < 1) return step;
  try {
    const resp = await fetch("/ui/rank", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query, items: step.items.map((it) => ({ title: it.title || "", snippet: it.snippet || "", url: it.url || "" })) }),
    });
    if (!resp.ok) return step;
    const data = await resp.json();
    if (!Array.isArray(data.order)) return step;
    return { ...step, items: data.order.map((i) => step.items[i]) };
  } catch (err) {
    return step;
  }
}

async function rankData(query, data) {
  if (data.status === "clarification_needed") return data;
  const entries = await Promise.all(Object.entries(data.results || {}).map(async ([k, step]) => [k, await rankStep(query, step)]));
  return { ...data, results: Object.fromEntries(entries) };
}

$("go").addEventListener("click", async () => {
  const status = $("status");
  const out = $("results");
  out.innerHTML = "";
  status.className = "status";
  const btn = $("go");
  btn.disabled = true;
  status.textContent = "Searching...";

  try {
    if ($("mode").value === "plain") {
      const text = $("request").value.trim();
      if (text.length < 2) throw new Error("Type a request first.");
      const data = await post({ request: text });
      if (data.status === "clarification_needed") {
        const slot = document.createElement("div");
        out.appendChild(slot);
        slot.innerHTML = tileFor("Plain language", data);
        return;
      }
      const RESULT_LABELS = { searxng_general: "Web search", searxng_news: "News", courtlistener: "Courts", sec_edgar: "SEC filings", fred: "Economic data" };
      for (const [key, step] of Object.entries(data.results || {})) {
        const label = RESULT_LABELS[key] || key;
        const single = { ...data, results: { [key]: step } };
        const slot = document.createElement("div");
        out.appendChild(slot);
        slot.innerHTML = tileFor(label, single, true);
        rankData(text, single).then((ranked) => { slot.innerHTML = tileFor(label, ranked); });
      }
      status.textContent = "Done.";
      return;
    } else {
      const query = $("query").value.trim();
      if (query.length < 2) throw new Error("Type a query first.");
      const forms = $("forms").value.split(",").map((s) => s.trim()).filter(Boolean);
      const picked = [...document.querySelectorAll('input[name="src"]:checked')].map((c) => c.value);
      if (picked.length === 0) throw new Error("Pick at least one source.");

      const slots = picked.map(() => {
        const slot = document.createElement("div");
        out.appendChild(slot);
        return slot;
      });
      let failures = 0;
      await Promise.all(picked.map(async (type, i) => {
        const label = LABELS[type];
        const slot = slots[i];
        try {
          const data = await fetchSource(type, query, forms);
          slot.innerHTML = tileFor(label, data, true);
          rankData(query, data).then((ranked) => { slot.innerHTML = tileFor(label, ranked); });
        } catch (err) {
          failures++;
          slot.innerHTML = '<h2>' + esc(label) + '</h2><div class="step error">' + esc(err.message) + "</div>";
        }
      }));
      status.textContent = "Done: " + (picked.length - failures) + " of " + picked.length + " sources returned.";
      return;
    }
    status.textContent = "Done.";
  } catch (err) {
    status.textContent = err.message;
    status.className = "status error";
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
